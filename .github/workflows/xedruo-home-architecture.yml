name: Apply Xedruo Pay & Play home architecture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xedruo-home-architecture.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Pay & Play home
        env:
          FILE: src/pages/PayAndPlay.jsx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/PayAndPlay.jsx')
          text = p.read_text()
          start_marker = '<section className="bg-white rounded-[26px] p-5 shadow-sm"><SectionTitle title="Xedruo Services"'
          start = text.index(start_marker)
          end_marker = '</section></>}'
          end = text.index(end_marker, start) + len('</section>')
          replacement = '''<section className="bg-white rounded-[26px] p-5 shadow-sm"><SectionTitle title="Partner Services" sub="Third-party services integrated into Xedruo"/><div className="grid grid-cols-4 gap-4 mt-4">{partners.slice(0,4).map(([n,I,p])=><Partner key={n} name={n} icon={I} provider={p}/>)}</div></section><section className="bg-white rounded-[26px] p-5 shadow-sm"><SectionTitle title="Xedruo Services" sub="Xedruo-owned services across your account"/><div className="grid grid-cols-4 gap-4 mt-4">{xservices.slice(0,4).map(([n,s,I])=><Tile key={s} name={n} icon={I} to={s==='distribution'?'/distribution':`/company/${s}`}/>)}</div><button onClick={()=>setTab('services')} className="mt-4 inline-flex items-center gap-1 text-emerald-600 text-sm font-semibold">More <ChevronRight className="w-4 h-4"/></button></section>'''
          text = text[:start] + replacement + text[end:]
          floating = '<button onClick={openPlay} className="fixed right-5 bottom-24 z-50 w-16 h-16 rounded-full bg-emerald-500 text-white shadow-2xl flex items-center justify-center border-4 border-white"><Play className="w-7 h-7 ml-1"/></button>'
          if floating in text:
              text = text.replace(floating, '')
          p.write_text(text)
          PY
      - name: Commit change
        run: |
          git config user.name 'Xedruo Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/PayAndPlay.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: simplify Pay & Play home service hierarchy'
          git push
